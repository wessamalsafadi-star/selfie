<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selfie form – reference</title>
<!--
  REFERENCE IMPLEMENTATION – selfie upload (OpenAI image generation)
  ==========================================================
  POST {WEBHOOK_URL} as multipart/form-data with:
    name          text
    email         text
    phone         text
    selfie        file  (jpeg / png / webp, max 10 MB)
    landing_page  text  (URL the form was submitted from)

  The webhook must answer only once the image is finished (n8n Webhook node:
  Respond = "When Last Node Finishes" or a "Respond to Webhook" node).
  Any of these response shapes is accepted:
    { "data": [ { "b64_json": "..." } ] }   raw OpenAI /v1/images/edits response
    { "b64_json": "..." }                   or { "image": "<base64 or data: URI>" }
    { "url": "https://..." }                if you host the image yourself
    binary image body (Content-Type: image/*)
  A one-item array wrapping any of the JSON shapes also works.
-->
<style>
  :root {
    --slate: #1F343F;
    --denim: #2C537A;
    --powder: #7BA0B2;
    --sand: #D9B9A0;
    --mist: #EDE8E4;
    --salmon: #FF787A;
    --error: #A3322B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 16px;
    font-family: "Ivy Epic", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--mist); color: var(--slate);
  }
  .card {
    max-width: 440px; margin: 0 auto; padding: 32px 28px;
    background: #fff; border-radius: 4px;
  }
  h1 {
    margin: 0 0 24px;
    font-family: "Ivy Mode", Georgia, serif;
    font-size: 28px; font-weight: 400; line-height: 1.2;
  }
  label, .label {
    display: block; margin-bottom: 6px;
    font-size: 14px; font-weight: 600;
  }
  input[type="text"], input[type="email"], input[type="tel"] {
    width: 100%; padding: 12px; margin-bottom: 18px;
    font: inherit; color: var(--slate);
    background: #fff; border: 1px solid var(--powder); border-radius: 4px;
  }
  input:focus-visible, .dropzone:focus-visible, button:focus-visible {
    outline: 2px solid var(--denim); outline-offset: 2px;
  }

  /* Drop zone: big plus in the middle, click or drop a photo */
  .dropzone {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    width: 100%; aspect-ratio: 4 / 3; margin-bottom: 20px;
    background: var(--mist);
    border: 1.5px dashed var(--powder); border-radius: 4px;
    cursor: pointer; overflow: hidden;
    transition: background .15s, border-color .15s;
  }
  .dropzone:hover, .dropzone.dragover { background: #e4ddd7; border-color: var(--slate); }
  .dropzone .plus {
    font-size: 96px; font-weight: 200; line-height: 1;
    color: var(--slate); user-select: none;
  }
  .dropzone img {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover;
  }
  .dropzone.has-file { border-style: solid; border-color: var(--slate); }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  button {
    width: 100%; padding: 14px;
    font: inherit; font-weight: 600; color: var(--slate);
    background: var(--salmon); border: 0; border-radius: 4px; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  #status { margin: 14px 0 0; font-size: 14px; min-height: 20px; }
  #status.error { color: var(--error); }
  #status.ok { color: var(--denim); }
  #result { margin-top: 24px; }
  #result img { display: block; width: 100%; border-radius: 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="card">
  <h1>Submit your selfie</h1>

  <form id="selfie-form" novalidate>
    <label for="name">Your name</label>
    <input id="name" name="name" type="text" autocomplete="name" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>

    <label for="phone">Phone number</label>
    <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel"
           placeholder="+971 50 123 4567" required>

    <span class="label" id="selfie-label">Selfie</span>
    <!-- Click, tap or drop a photo. The real file input is hidden; the drop zone drives it. -->
    <div id="dropzone" class="dropzone" role="button" tabindex="0"
         aria-labelledby="selfie-label" aria-describedby="selfie-hint">
      <span class="plus" aria-hidden="true">+</span>
      <img id="preview" alt="Preview of the selected selfie" hidden>
    </div>
    <span id="selfie-hint" class="visually-hidden">Add a photo. JPG, PNG or WebP, up to 10 MB.</span>
    <!-- capture="user" opens the front camera on phones; desktop shows a file picker -->
    <input id="selfie" name="selfie" type="file" class="visually-hidden" tabindex="-1"
           accept="image/jpeg,image/png,image/webp" capture="user">

    <button id="submit-btn" type="submit">Upload</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>

  <!-- Shown after a successful upload, using the image returned by the webhook -->
  <div id="result" hidden>
    <span class="label">Your 1986 photo</span>
    <img id="result-img" alt="Generated 1986-style photo">
  </div>
</div>

<script>
  // ── CONFIG ────────────────────────────────────────────────────────────
  const WEBHOOK_URL = "https://engageteam.app.n8n.cloud/webhook/48ed49fe-0169-485c-9758-5f814e29defb";
  const MAX_SIZE_MB = 10;
  const ALLOWED_TYPES = ["image/jpeg", "image/png", "image/webp"];
  // The webhook now stays open while OpenAI generates the image, so allow for a long wait.
  const REQUEST_TIMEOUT_MS = 150000;
  // ──────────────────────────────────────────────────────────────────────

  const form      = document.getElementById("selfie-form");
  const fileInput = document.getElementById("selfie");
  const dropzone  = document.getElementById("dropzone");
  const preview   = document.getElementById("preview");
  const button    = document.getElementById("submit-btn");
  const statusEl  = document.getElementById("status");
  const result    = document.getElementById("result");
  const resultImg = document.getElementById("result-img");

  let selectedFile = null;   // set by the file picker OR by drag-and-drop
  let resultObjectUrl = null; // blob: URL of the last generated image, if any

  function setStatus(message, type) {
    statusEl.textContent = message;
    statusEl.className = type || "";
  }

  function validateFile(file) {
    if (!file) return "Please add a photo.";
    if (!ALLOWED_TYPES.includes(file.type)) return "Please use a JPG, PNG or WebP image.";
    if (file.size > MAX_SIZE_MB * 1024 * 1024) return "Image is larger than " + MAX_SIZE_MB + " MB.";
    return null;
  }

  function clearFile() {
    selectedFile = null;
    fileInput.value = "";
    preview.hidden = true;
    preview.removeAttribute("src");
    dropzone.classList.remove("has-file");
  }

  function selectFile(file) {
    const error = validateFile(file);
    if (error) {
      clearFile();
      setStatus(error, "error");
      return;
    }
    selectedFile = file;
    preview.src = URL.createObjectURL(file);
    preview.hidden = false;
    dropzone.classList.add("has-file");
    setStatus("");
  }

  // Open the picker on click / Enter / Space
  dropzone.addEventListener("click", () => fileInput.click());
  dropzone.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
  });
  fileInput.addEventListener("change", () => {
    if (fileInput.files[0]) selectFile(fileInput.files[0]);
  });

  // Drag and drop
  ["dragenter", "dragover"].forEach((type) =>
    dropzone.addEventListener(type, (e) => { e.preventDefault(); dropzone.classList.add("dragover"); }));
  ["dragleave", "drop"].forEach((type) =>
    dropzone.addEventListener(type, (e) => { e.preventDefault(); dropzone.classList.remove("dragover"); }));
  dropzone.addEventListener("drop", (e) => {
    const file = e.dataTransfer && e.dataTransfer.files[0];
    if (file) selectFile(file);
  });

  // ── Reading the webhook response ──────────────────────────────────────
  // Base64 image data starts with a recognisable signature per format.
  function mimeFromBase64(b64) {
    if (b64.startsWith("/9j/"))   return "image/jpeg";
    if (b64.startsWith("iVBOR"))  return "image/png";
    if (b64.startsWith("UklGR"))  return "image/webp";
    return "image/png";
  }

  // Turns whatever JSON the webhook returned into something usable as <img src>.
  function imageSrcFromJson(data) {
    let item = Array.isArray(data) ? data[0] : data;
    if (!item) return null;
    // Raw OpenAI response: { data: [ { b64_json } ] }
    if (Array.isArray(item.data) && item.data[0]) item = item.data[0];

    const b64 = item.b64_json || item.image || item.base64;
    if (typeof b64 === "string" && b64.trim()) {
      const clean = b64.trim();
      if (clean.startsWith("data:image/")) return clean;
      const compact = clean.replace(/\s+/g, "");
      return "data:" + mimeFromBase64(compact) + ";base64," + compact;
    }

    const url = String(item.url || "").trim().replace(/^http:\/\//, "https://");
    if (url.startsWith("https://")) return url;
    return null;
  }

  // Resolves once the browser has actually decoded the image.
  function loadImage(img, src) {
    return new Promise((resolve, reject) => {
      img.onload = () => resolve();
      img.onerror = () => reject(new Error("Returned image could not be displayed"));
      img.src = src;
    });
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const name  = form.elements.name.value.trim();
    const email = form.elements.email.value.trim();
    const phone = form.elements.phone.value.trim();

    if (!name) return setStatus("Please enter your name.", "error");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setStatus("Please enter a valid email address.", "error");
    if (phone.replace(/\D/g, "").length < 7) return setStatus("Please enter a valid phone number.", "error");
    const fileError = validateFile(selectedFile);
    if (fileError) return setStatus(fileError, "error");

    // Build the multipart body. Field names must match the n8n workflow.
    const body = new FormData();
    body.append("name", name);
    body.append("email", email);
    body.append("phone", phone);
    body.append("selfie", selectedFile, selectedFile.name);
    body.append("landing_page", window.location.href);

    button.disabled = true;
    // Generation happens inside this one request, so the wait is here.
    setStatus("Creating your 1986 photo… this can take up to a minute.");

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

    try {
      // No headers: the browser sets multipart/form-data + boundary itself.
      const response = await fetch(WEBHOOK_URL, { method: "POST", body, signal: controller.signal });
      if (!response.ok) throw new Error("Server responded with " + response.status);

      let src;
      let newObjectUrl = null;
      const contentType = (response.headers.get("content-type") || "").toLowerCase();

      if (contentType.startsWith("image/")) {
        // Webhook answered with the image file itself
        newObjectUrl = URL.createObjectURL(await response.blob());
        src = newObjectUrl;
      } else {
        const data = await response.json();
        src = imageSrcFromJson(data);
        if (!src) {
          console.log("Webhook response keys:", Object.keys(Array.isArray(data) ? (data[0] || {}) : data));
          throw new Error("Response did not contain an image");
        }
      }

      await loadImage(resultImg, src);
      if (resultObjectUrl) URL.revokeObjectURL(resultObjectUrl);
      resultObjectUrl = newObjectUrl;

      result.hidden = false;
      form.reset();
      clearFile();
      setStatus("Your photo is ready.", "ok");
    } catch (err) {
      console.error("Selfie upload failed:", err);
      setStatus(err.name === "AbortError"
        ? "This is taking longer than expected. Please try again."
        : "Upload failed. Please try again.", "error");
    } finally {
      clearTimeout(timer);
      button.disabled = false;
    }
  });
</script>
</body>
</html>
